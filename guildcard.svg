  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2a2a4a" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="hdr"><rect x="20" y="20" width="460" height="44" rx="8"/></clipPath>
    <style>
      .blink { animation: blink 1.2s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .glow { animation: glow 2.4s ease-in-out infinite; }
      @keyframes glow { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
      .bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.4s ease-out both; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      .sweep { animation: sweep 4s linear infinite; }
      @keyframes sweep { from { transform: translateX(-140px); } to { transform: translateX(620px); } }
      .bob { animation: bob 1.6s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    </style>
  </defs>
