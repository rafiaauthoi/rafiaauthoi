<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="500" height="700" viewBox="0 0 500 700">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2a2a4a" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="500" height="700" fill="#0d0d1a" rx="16"/>
  <rect width="500" height="700" fill="url(#grid)" rx="16"/>

  <!-- Outer border -->
  <rect x="8" y="8" width="484" height="684" fill="none" stroke="#FF69B4" stroke-width="2" rx="12" stroke-dasharray="8,4"/>
  <rect x="14" y="14" width="472" height="672" fill="none" stroke="#ff69b455" stroke-width="1" rx="10"/>

  <!-- Header bar -->
  <rect x="20" y="20" width="460" height="44" fill="#FF69B4" rx="8"/>
  <text x="250" y="48" text-anchor="middle" font-size="13" fill="#1a0010" font-family="'Courier New', monospace" font-weight="bold">* TRAINER CARD *</text>

  <!-- Divider 1 -->
  <line x1="20" y1="76" x2="480" y2="76" stroke="#FF69B4" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Trainer info -->
  <text x="30" y="100" font-size="8" fill="#aaaaaa" font-family="'Courier New', monospace">NAME  :</text>
  <text x="115" y="100" font-size="8" fill="#FF69B4" font-family="'Courier New', monospace">RAFIA AUTHOI</text>
  <text x="30" y="118" font-size="8" fill="#aaaaaa" font-family="'Courier New', monospace">ROLE :</text>
  <text x="115" y="118" font-size="8" fill="#ffffff" font-family="'Courier New', monospace">DATA ANALYST</text>
  <text x="30" y="136" font-size="8" fill="#aaaaaa" font-family="'Courier New', monospace">REGION:</text>
  <text x="115" y="136" font-size="8" fill="#ffffff" font-family="'Courier New', monospace">KALAMAZOO, MI</text>
  <text x="30" y="154" font-size="8" fill="#aaaaaa" font-family="'Courier New', monospace">BADGE :</text>
  <text x="115" y="154" font-size="8" fill="#FFD700" font-family="'Courier New', monospace">WMU CIS * CYBERSEC MINOR</text>

  <!-- Divider 2 -->
  <line x1="20" y1="168" x2="480" y2="168" stroke="#FF69B4" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- SKILLSET -->
  <text x="30" y="188" font-size="9" fill="#FF69B4" font-family="'Courier New', monospace" font-weight="bold">▶ SKILLSET</text>

  <text x="30" y="210" font-size="8" fill="#aaaaaa" font-family="'Courier New', monospace">EXCEL  </text>
  <rect x="115" y="200" width="290" height="10" fill="#1e1e3a" rx="2"/>
  <rect x="115" y="200" width="247" height="10" fill="#FF69B4" rx="2"/>
  <text x="415" y="210" font-size="8" fill="#44ff88" font-family="'Courier New', monospace">95</text>

  <text x="30" y="210" font-size="8" fill="#aaaaaa" font-family="'Courier New', monospace">SQL     </text>
  <rect x="115" y="200" width="290" height="10" fill="#1e1e3a" rx="2"/>
  <rect x="115" y="200" width="247" height="10" fill="#FF69B4" rx="2"/>
  <text x="415" y="210" font-size="8" fill="#44ff88" font-family="'Courier New', monospace">75</text>

  <text x="30" y="228" font-size="8" fill="#aaaaaa" font-family="'Courier New', monospace">POWER BI</text>
  <rect x="115" y="218" width="290" height="10" fill="#1e1e3a" rx="2"/>
  <rect x="115" y="218" width="218" height="10" fill="#FF69B4" rx="2"/>
  <text x="415" y="228" font-size="8" fill="#44ff88" font-family="'Courier New', monospace">70</text>

  <text x="30" y="246" font-size="8" fill="#aaaaaa" font-family="'Courier New', monospace">TABLEAU </text>
  <rect x="115" y="236" width="290" height="10" fill="#1e1e3a" rx="2"/>
  <rect x="115" y="236" width="203" height="10" fill="#FF69B4" rx="2"/>
  <text x="415" y="246" font-size="8" fill="#44ff88" font-family="'Courier New', monospace">70</text>

  <text x="30" y="264" font-size="8" fill="#aaaaaa" font-family="'Courier New', monospace">PYTHON  </text>
  <rect x="115" y="254" width="290" height="10" fill="#1e1e3a" rx="2"/>
  <rect x="115" y="254" width="174" height="10" fill="#FF69B4" rx="2"/>
  <text x="415" y="264" font-size="8" fill="#44ff88" font-family="'Courier New', monospace">60</text>


  <!-- Divider 3 -->
  <line x1="20" y1="296" x2="480" y2="296" stroke="#FF69B4" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- PARTY SECTION -->
  <text x="30" y="316" font-size="9" fill="#FF69B4" font-family="'Courier New', monospace" font-weight="bold">▶ PARTY POKEMON</text>

  <!-- Bulbasaur box -->
  <rect x="30" y="326" width="96" height="96" fill="#1a1a2e" rx="6" stroke="#FF69B4" stroke-width="1.5"/>
  <image href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png" x="30" y="326" width="96" height="96" image-rendering="pixelated"/>
  <text x="78" y="432" text-anchor="middle" font-size="7" fill="#ffffff" font-family="'Courier New', monospace">BULBASAUR</text>
  <text x="78" y="446" text-anchor="middle" font-size="7" fill="#44ff88" font-family="'Courier New', monospace">LVL 12</text>

  <!-- Clodsire box -->
  <rect x="145" y="326" width="96" height="96" fill="#1a1a2e" rx="6" stroke="#FF69B4" stroke-width="1.5"/>
  <image href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/980.png" x="145" y="326" width="96" height="96" image-rendering="pixelated"/>
  <text x="193" y="432" text-anchor="middle" font-size="7" fill="#ffffff" font-family="'Courier New', monospace">CLODSIRE</text>
  <text x="193" y="446" text-anchor="middle" font-size="7" fill="#44ff88" font-family="'Courier New', monospace">LVL 18</text>

  <!-- Divider 4 -->
  <line x1="20" y1="460" x2="480" y2="460" stroke="#FF69B4" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ACHIEVEMENTS -->
  <text x="30" y="480" font-size="9" fill="#FF69B4" font-family="'Courier New', monospace" font-weight="bold">▶ ACHIEVEMENTS</text>
  <text x="30" y="500" font-size="8" fill="#FFD700" font-family="'Courier New', monospace">* WMU CIS Student</text>
  <text x="30" y="516" font-size="8" fill="#FFD700" font-family="'Courier New', monospace">* Cybersecurity Minor Active</text>
  <text x="30" y="532" font-size="8" fill="#FFD700" font-family="'Courier New', monospace">* First Project Deployed</text>

  <!-- Divider 5 -->
  <line x1="20" y1="546" x2="480" y2="546" stroke="#FF69B4" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- CURRENT QUEST -->
  <text x="30" y="566" font-size="9" fill="#FF69B4" font-family="'Courier New', monospace" font-weight="bold">▶ CURRENT QUEST</text>
  <text x="30" y="586" font-size="8" fill="#ffffff" font-family="'Courier New', monospace">→ DEFEAT: Entry-Level Job Market</text>
  <text x="30" y="602" font-size="8" fill="#ffffff" font-family="'Courier New', monospace">→ COLLECT: Internship Badge</text>
  <text x="30" y="618" font-size="8" fill="#ffffff" font-family="'Courier New', monospace">→ UNLOCK: DB Architect Title</text>

  <!-- Divider 6 -->
  <line x1="20" y1="632" x2="480" y2="632" stroke="#FF69B4" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- EXP bar -->
  <text x="30" y="650" font-size="8" fill="#aaaaaa" font-family="'Courier New', monospace">EXP</text>
  <rect x="72" y="640" width="310" height="10" fill="#1e1e3a" rx="2"/>
  <rect x="72" y="640" width="170" height="10" fill="#FFD700" rx="2"/>
  <text x="392" y="650" font-size="8" fill="#FFD700" font-family="'Courier New', monospace">55%</text>
  <text x="440" y="650" font-size="8" fill="#aaaaaa" font-family="'Courier New', monospace">LV.3</text>

  <!-- STATUS -->
  <text x="250" y="678" text-anchor="middle" font-size="8" fill="#44ff88" font-family="'Courier New', monospace">▮ OPEN TO WORK</text>
  <text x="250" y="694" text-anchor="middle" font-size="7" fill="#FF69B4" font-family="'Courier New', monospace">ANALYST IN TRAINING</text>
</svg>
